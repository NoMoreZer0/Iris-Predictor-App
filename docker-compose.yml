version: "3.9"

services:
  iris-app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ENABLECORS: "false"
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "false"
    command: ["streamlit", "run", "classification.py", "--server.port=8501", "--server.address=0.0.0.0"]
